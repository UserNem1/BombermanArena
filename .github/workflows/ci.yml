name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check repository
        run: |
          echo "Repository checkout successful"
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"

  detect-client:
    name: Detect client
    runs-on: ubuntu-24.04
    outputs:
      has-client: ${{ steps.detect.outputs.has-client }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for client
        id: detect
        shell: bash
        run: |
          if [ -f "client/package.json" ]; then
            echo "Client detected"
            echo "has-client=true" >> "$GITHUB_OUTPUT"
          else
            echo "No client found"
            echo "has-client=false" >> "$GITHUB_OUTPUT"
          fi

  client:
    name: Client build and tests
    needs: detect-client
    if: needs.detect-client.outputs.has-client == 'true'
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test
